[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar-positioning-usda-vintages"
version = "0.1.0"
description = "Publication-aware Sugar No. 11 positioning study and point-in-time USDA WASDE tracker"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.1",
    "ruff==0.12.8",
]

[project.scripts]
sugar-market-study = "sugar_market_study.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-local-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
no_site_packages = true

[[tool.mypy.overrides]]
module = ["pytest"]
ignore_missing_imports = true
